<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>oneVoice homepage — mobile / tablet / desktop breakpoints</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
  /* Presentation shell only. The design itself lives in onevoice-homepage.mockup.html
     and is loaded below in real iframes — this file never duplicates its markup. */
  :root{ --bg:#F4F2EE; --panel:#FFFFFF; --line:#E2DDD5; --text:#1A1815; --dim:#6F6A62; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
  .shell{max-width:1680px;margin:0 auto;padding:26px 26px 70px}
  h1{font-family:Fraunces,Georgia,serif;font-variation-settings:'SOFT' 30,'opsz' 60;
     font-size:24px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--dim);max-width:840px;line-height:1.6;margin:0}
  .sub a{color:var(--text)}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
       background:#EBE7E0;padding:1px 5px;border-radius:4px}
  .toolbar{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;background:var(--panel);
       border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:20px 0 28px}
  .grp{display:flex;flex-direction:column;gap:8px}
  .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .tenants{display:flex;gap:8px;flex-wrap:wrap}
  .tbtn{display:flex;align-items:center;gap:8px;background:#fff;color:var(--text);border:1px solid var(--line);
        border-radius:999px;padding:9px 15px;font:inherit;font-size:13px;cursor:pointer;transition:.15s}
  .tbtn:hover{border-color:#B8B2A9}
  .tbtn[aria-pressed="true"]{background:#1A1815;color:#fff;border-color:#1A1815;font-weight:600}
  .dot{width:11px;height:11px;border-radius:50%}
  .switch{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px}
  .switch input{width:16px;height:16px;accent-color:#1A1815;cursor:pointer}
  .frames{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
  .fhead{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
  .fname{font-size:13px;font-weight:600}
  .fdim{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .viewport{position:relative;overflow:hidden;border-radius:12px;border:1px solid #D5CFC6;background:#fff;
       box-shadow:0 2px 6px rgba(26,24,21,.06), 0 20px 48px -22px rgba(26,24,21,.32)}
  .viewport iframe{border:0;display:block;transform-origin:top left}
</style>
</head>
<body>
<div class="shell">
  <h1>oneVoice homepage — breakpoint check</h1>
  <p class="sub">Three live iframes of <code>onevoice-homepage.mockup.html</code> at 390 / 834 / 1440&nbsp;px,
    so real Tailwind breakpoints apply. This file contains no design markup of its own — open the page file
    directly to review the design at full size.</p>

  <div class="toolbar">
    <div class="grp">
      <span class="lbl">Tenant (accent token set)</span>
      <div class="tenants" id="tenants">
        <button class="tbtn" data-tenant="amyloidosis" aria-pressed="true"><span class="dot" style="background:#7C1419"></span>Amyloidosis</button>
        <button class="tbtn" data-tenant="scd" aria-pressed="false"><span class="dot" style="background:#7C1419"></span>Sickle Cell Disease</button>
        <button class="tbtn" data-tenant="ph" aria-pressed="false"><span class="dot" style="background:#4A4EBB"></span>Pulmonary Hypertension <em style="font-style:normal;color:#6F6A62">#3</em></button>
        <button class="tbtn" data-tenant="mg" aria-pressed="false"><span class="dot" style="background:#9E6714"></span>Myasthenia Gravis <em style="font-style:normal;color:#6F6A62">#4</em></button>
      </div>
    </div>
    <div class="grp">
      <span class="lbl">Overlay</span>
      <label class="switch"><input type="checkbox" id="notes"> Show SEO / schema / token annotations</label>
    </div>
  </div>

  <div class="frames" id="frames"></div>
</div>

<script>
(function(){
  var PAGE = 'onevoice-homepage.mockup.html';
  var DEVICES = [
    { name:'Mobile',  w:390,  note:'iPhone 15 · base styles' },
    { name:'Tablet',  w:834,  note:'iPad 11" · md: breakpoint' },
    { name:'Desktop', w:1440, note:'lg: / xl: breakpoints' }
  ];

  var host = document.getElementById('frames');
  var state = { tenant:'amyloidosis', notes:false };
  var frames = [];

  DEVICES.forEach(function(d){
    var wrap = document.createElement('div');
    wrap.innerHTML =
      '<div class="fhead"><span class="fname">' + d.name + '</span>' +
      '<span class="fdim">' + d.w + 'px · ' + d.note + '</span></div>' +
      '<div class="viewport"><iframe title="' + d.name + ' preview" src="' + PAGE + '"></iframe></div>';
    host.appendChild(wrap);

    var f = { dev:d, view:wrap.querySelector('.viewport'), iframe:wrap.querySelector('iframe'), h:1400, scale:1 };
    f.iframe.style.width = d.w + 'px';
    f.iframe.addEventListener('load', function(){ send(f); });
    frames.push(f);
  });

  function send(f){
    try { f.iframe.contentWindow.postMessage({ tenant:state.tenant, notes:state.notes }, '*'); } catch(e){}
  }
  function broadcast(){ frames.forEach(send); }

  function apply(f){
    f.iframe.style.height = f.h + 'px';
    f.iframe.style.transform = 'scale(' + f.scale + ')';
    f.view.style.width  = Math.round(f.dev.w * f.scale) + 'px';
    f.view.style.height = Math.round(f.h * f.scale) + 'px';
  }
  function layout(){
    var avail = host.clientWidth, gap = 32;
    var m = frames[0], t = frames[1], d = frames[2];
    if (avail >= m.dev.w + gap + 600) {
      m.scale = 1;
      t.scale = Math.min(1, (avail - m.dev.w - gap) / t.dev.w);
    } else {
      m.scale = Math.min(1, avail / m.dev.w);
      t.scale = Math.min(1, avail / t.dev.w);
    }
    d.scale = Math.min(1, avail / d.dev.w);
    frames.forEach(apply);
  }

  window.addEventListener('message', function(e){
    if (!e.data || typeof e.data.h !== 'number') return;
    frames.forEach(function(f){
      if (f.iframe.contentWindow === e.source) {
        var h = Math.max(600, Math.round(e.data.h));
        if (Math.abs(h - f.h) > 2) { f.h = h; apply(f); }
      }
    });
  });

  document.getElementById('tenants').addEventListener('click', function(e){
    var btn = e.target.closest('.tbtn'); if (!btn) return;
    state.tenant = btn.dataset.tenant;
    this.querySelectorAll('.tbtn').forEach(function(b){ b.setAttribute('aria-pressed', String(b === btn)); });
    broadcast();
  });
  document.getElementById('notes').addEventListener('change', function(){
    state.notes = this.checked; broadcast();
  });

  window.addEventListener('resize', layout);
  layout();
})();
</script>
</body>
</html>
